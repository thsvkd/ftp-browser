appId: com.ftp-browser.app
productName: FTP Browser
publish:
  provider: github
  owner: thsvkd
  repo: ftp-browser
directories:
  buildResources: build
# 허용 목록이다. 제외 목록으로 두면 루트에 새로 생기는 디렉터리를 계속 따라가야 하는데
# 그건 완전할 수 없다 — .stryker-tmp(뮤테이션 샌드박스)가 통째로 들어가면서 중복
# out/main/index.js가 asar에 섞여 패키징된 앱이 실행 즉시 죽은 적이 있다. CI는 fresh
# checkout이라 그 실패가 드러나지 않는다. node_modules의 production 의존성은
# electron-builder가 package.json을 보고 알아서 넣으므로 여기에 적지 않는다.
#   out/**       main·preload·renderer 번들
#   resources/** icon.png (asarUnpack 대상)
#   package.json electron이 main 진입점을 읽는다
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
win:
  executableName: ftp-browser
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  differentialPackage: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
