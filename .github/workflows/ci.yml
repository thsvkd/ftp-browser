name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-packaged-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Verify runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') { console.error('Expected ${{ matrix.arch }}, got ' + process.arch); process.exit(1) }"

      - name: Install Linux display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build unpacked app
        run: npm run build:unpack -- --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Smoke packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:packaged

      - name: Smoke packaged app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
